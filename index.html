<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make your bird log</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#13201A;background:#F2F4EF}
  h1{font-family:Georgia,serif;margin:0 0 4px}
  .card{background:#fff;border:1px solid #CBD3C8;border-radius:12px;padding:18px;margin-top:18px}
  label{display:block;margin:12px 0 4px;font-size:14px;color:#56655C}
  input[type=text],select{width:100%;height:38px;padding:0 10px;border:1px solid #CBD3C8;border-radius:8px;font:inherit}
  button{height:42px;padding:0 18px;border:0;border-radius:10px;background:#13201A;color:#fff;font:inherit;cursor:pointer;margin-top:16px}
  button:disabled{opacity:.5;cursor:wait}
  pre{white-space:pre-wrap;font-size:13px;color:#56655C;margin:0}
  a.dl{display:inline-block;margin-top:14px;font-weight:600}
</style>
</head>
<body>
<h1>Make your bird log</h1>
<p>Pick your eBird, Roberts or BirdLasser CSV. Everything runs in your browser; your file is not uploaded anywhere.</p>

<div class="card">
  <label for="files">Sightings CSV</label>
  <input id="files" type="file" accept=".csv" multiple>
  <label for="title">Page heading</label>
  <input id="title" type="text" value="Bird log">
  <label for="names">Bird names open in</label>
  <select id="names"><option value="af">Afrikaans</option><option value="en">English</option></select>
  <button id="go" disabled>Loading Python…</button>
  <div id="out"></div>
</div>
<div class="card"><pre id="log"></pre></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; };
let py;

async function boot(){
  py = await loadPyodide();
  for (const name of ['birding_report.py', 'BirdReference.csv']){
    const r = await fetch(name);
    if (!r.ok) throw new Error('Could not load ' + name);
    py.FS.writeFile('/home/pyodide/' + name, new Uint8Array(await r.arrayBuffer()));
  }
  py.FS.mkdir('/data');
  $('go').disabled = false; $('go').textContent = 'Make my report';
  log('Ready.');
}
boot().catch(e => { $('go').textContent = 'Failed to load'; log(String(e)); });

$('go').addEventListener('click', async () => {
  const picked = [...$('files').files];
  if (!picked.length){ log('Choose a CSV file first.'); return; }
  $('go').disabled = true; $('out').innerHTML = ''; $('log').textContent = '';
  try {
    const paths = [];
    for (const f of picked){
      const p = '/data/' + f.name.replace(/[^\w.\- ]/g, '_');
      py.FS.writeFile(p, new Uint8Array(await f.arrayBuffer()));
      paths.push(p);
    }
    py.globals.set('paths', paths);
    py.globals.set('title', $('title').value || 'Bird log');
    py.globals.set('names', $('names').value);
    const result = await py.runPythonAsync(`
import sys, os
sys.path.insert(0, "/home/pyodide")
os.chdir("/home/pyodide")
import importlib, birding_report
importlib.reload(birding_report)
lines = []
r = birding_report.build_report(list(paths), "/home/pyodide/BirdReference.csv", names, title, None, log=lines.append)
"\\n".join(lines), r["html"]
`);
    const [text, html] = result.toJs();
    log(text);
    const url = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
    $('out').innerHTML = `<a class="dl" href="${url}" download="birding_report.html">Download birding_report.html</a>`;
    log('Done. Open the downloaded file in Chrome, Edge, Firefox or Safari while online.');
  } catch (e) {
    log('Error: ' + (e.message || e));
  } finally { $('go').disabled = false; }
});
</script>
</body>
</html>
